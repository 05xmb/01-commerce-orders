# SPA 托管 + 反向代理（容器内 ROLE=web 时使用，作为 nginx 主配置加载）
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

server {
    listen 80;
    server_name _;

    root /app/web/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 交易系统 API
    location /api/ {
        proxy_pass http://trade-api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 模拟支付渠道（前端支付按钮直连渠道）
    location /channel/ {
        proxy_pass http://pay-channel:8902;
        proxy_set_header Host $host;
    }

    # 健康检查
    location = /healthz {
        proxy_pass http://trade-api:8888/healthz;
    }
}
}
