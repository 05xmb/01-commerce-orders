name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

env:
  COVERAGE_MIN: 85

jobs:
  # 质量门禁：格式、静态检查、单测（含 -race）、覆盖率门槛
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: gofmt 检查
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "存在未格式化文件："; gofmt -l .; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试（-race 竞争检测）
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: 覆盖率门禁（整体 ≥85%，核心包 ≥85%）
        run: |
          total=$(go tool cover -func coverage.out | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          echo "整体语句覆盖率: ${total}%"
          if [ "$total" -lt "$COVERAGE_MIN" ]; then
            echo "覆盖率 ${total}% 低于门禁 ${COVERAGE_MIN}%"; exit 1
          fi
          for pkg in internal/service internal/handler internal/repo/mysql; do
            cov=$(go tool cover -func coverage.out | grep "trade/${pkg}/" | awk '{gsub("%","",$3); s+=$3; n+=1} END {if (n>0) printf "%.0f", s/n; else print 0}')
            echo "${pkg}: ${cov}%"
            if [ "$cov" -lt "$COVERAGE_MIN" ]; then
              echo "核心包 ${pkg} 覆盖率 ${cov}% 低于门禁"; exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # 前端构建
  web-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装与构建
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # 后端编译 + Docker 镜像（仅版本 Tag 触发构建推送）
  release:
    runs-on: ubuntu-latest
    needs: [quality, web-build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: 编译后端二进制（linux/amd64）
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/trade-api ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/pay-channel ./cmd/channel

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: 构建并推送 Docker 镜像
        run: |
          IMAGE=trade-app:${GITHUB_REF_NAME}
          docker build -t "$IMAGE" -f Dockerfile .
          echo "$DOCKER_REPO_PASS" | docker login "$DOCKER_REPO" -u "$DOCKER_REPO_USER" --password-stdin
          docker tag "$IMAGE" "$DOCKER_REPO/$IMAGE"
          docker push "$DOCKER_REPO/$IMAGE"
        env:
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
          DOCKER_REPO_USER: ${{ secrets.DOCKER_REPO_USER }}
          DOCKER_REPO_PASS: ${{ secrets.DOCKER_REPO_PASS }}

      - name: 调用 1Panel 接口更新部署
        run: |
          curl -fsSL -X POST "$ONE_PANEL_URL/api/v1/apps/installed/$ONE_PANEL_APP_ID/upgrade" \
            -H "Authorization: Bearer $ONE_PANEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"$DOCKER_REPO/trade-app:${GITHUB_REF_NAME}\"}"
        env:
          ONE_PANEL_URL: ${{ secrets.ONE_PANEL_URL }}
          ONE_PANEL_TOKEN: ${{ secrets.ONE_PANEL_TOKEN }}
          ONE_PANEL_APP_ID: ${{ secrets.ONE_PANEL_APP_ID }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}

      - name: 健康检查与冒烟
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL "$APP_BASE_URL/healthz" > /dev/null; then break; fi
            sleep 2
          done
          curl -fsSL "$APP_BASE_URL/healthz" | grep -q '"code":0'
          echo "健康检查通过"
          TOKEN=$(curl -fsSL -X POST "$APP_BASE_URL/api/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"op01","password":"123456"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')
          curl -fsSL "$APP_BASE_URL/api/ops/summary" -H "Authorization: Bearer $TOKEN" | grep -q '"code":0'
          echo "冒烟通过：登录 + 运营汇总正常"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
